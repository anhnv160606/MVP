[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "electrical-design-agent"
version = "0.1.0"
description = "Backend for IFC-based electrical design"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.7,<3",
    "supabase>=2,<3",
    "ifcopenshell>=0.8,<0.9",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "google-genai>=3.3.0",
    "groq>=1.7.0",
    "openai>=3.51.0",
    "openpyxl>=3.1,<4",
    "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
ifcmcp = [
    "ifcquery @ git+https://github.com/IfcOpenShell/IfcOpenShell.git@7ab6fca86733a5cda959114e56244eee0a4ec822#subdirectory=src/ifcquery",
    "ifcedit @ git+https://github.com/IfcOpenShell/IfcOpenShell.git@7ab6fca86733a5cda959114e56244eee0a4ec822#subdirectory=src/ifcedit",
    "ifcopenshell-mcp @ git+https://github.com/IfcOpenShell/IfcOpenShell.git@7ab6fca86733a5cda959114e56244eee0a4ec822#subdirectory=src/ifcmcp",
]

[project.scripts]
electrical-design = "electrical_design.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["electrical_design", "config", "database", "agent", "api", "tools", "llm", "memory", "ifc_engine"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "httpx>=0.28,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: requires Supabase credentials and performs network reads", "ifc: real ctr.ifc integration"]

[tool.ruff.lint.per-file-ignores]
"test/test_ifc_write.py" = ["E402"]
